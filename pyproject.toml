[project]
name = "decodinggptfinalproj"
version = "0.1.0"
description = "GPT-2 symbolic algebra experiment comparing text-only and node-type structured fine-tuning."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.0",
    "sympy>=1.14.0",
    "torch>=2.8.0",
    "transformers>=4.57.1",
    "tqdm>=4.67.1",
]

[project.scripts]
compare-models = "src.main:main"
generate-dataset = "src.dataset_generator:main"
plot-test-losses = "src.plot_test_losses:main"
plot-batch-losses = "src.plot_batch_losses:main"
plot-comparison-accuracy = "src.plot_comparison_accuracy:main"
plot-training-curves = "src.plot_training_curves:main"
train-baseline = "src.train_baseline:main"
train-structured = "src.train_structured:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]
